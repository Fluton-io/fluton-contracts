[profile.default]
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test'
cache_path  = 'cache_forge'
remappings = [
    "solady/src/utils/=lib/solady/src/utils/",
    "solady/=lib/solady/src/",
    "solady/src/=lib/solady/src/",
    "solady/utils/=lib/solady/src/utils/",
    "solidity-bytes-utils/=lib/solidity-bytes-utils/",
    "solidity-bytes-utils/BytesLib.sol=lib/solidity-bytes-utils/contracts/BytesLib.sol",
    "solidity-bytes-utils/contracts/BytesLib.sol=lib/solidity-bytes-utils/contracts/BytesLib.sol",
    "solidity-stringutils/=lib/solidity-stringutils/",
    "solidity-stringutils/src/=lib/solidity-stringutils/src/",
    "@openzeppelin-upgradeable/=lib/openzeppelin-contracts-upgradeable/"
]
